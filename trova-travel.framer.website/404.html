<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | Executive Tours &amp; Travel Travel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100%;
    height: 100vh;
    background: #000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  canvas {
    width: 100%;
    height: 100%;
  }

  .characters-layer {
    position: absolute;
    width: 99%;
    height: 95%;
  }

  .characters-layer img {
    position: absolute;
    width: 18%;
    height: 18%;
  }

  .message-layer {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 90%;
    height: 90%;
    z-index: 100;
  }

  .message-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity:1;
    transition: opacity 0.5s ease;
  }

  .message-inner.visible {
    opacity: 1;
  }

  .msg-title {
    font-size: 35px;
    font-weight: 600;
    color: #000;
    margin: 1%;
  }

  .msg-code {
    font-size: 80px;
    font-weight: 700;
    color: #000;
    margin: 1%;
  }

  .msg-desc {
    font-size: 15px;
    width: 50%;
    min-width: 40%;
    text-align: center;
    color: #000;
    margin: 1%;
  }

  .msg-buttons {
    display: flex;
    gap: 24px;
    margin-top: 32px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 24px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    border: none;
    outline: none;
  }

  .btn:hover {
    transform: scale(1.05);
  }

  .btn-outline {
    color: #000;
    background: transparent;
    border: 2px solid #000;
  }

  .btn-outline:hover {
    background: #000;
    color: #fff;
  }

  .btn-filled {
    background: #000;
    color: #fff;
    border: 2px solid #000;
  }

  .btn-filled:hover {
    background: #222;
  }

  .btn svg {
    transition: transform 0.2s ease;
  }

  @media (max-width: 600px) {
    .msg-title { font-size: 22px; }
    .msg-code { font-size: 52px; }
    .msg-desc { font-size: 13px; width: 80%; }
    .msg-buttons { gap: 12px; }
    .btn { padding: 6px 16px; font-size: 14px; }
  }
</style>
</head>
<body>

<!-- Canvas (circle animation) -->
<canvas id="circleCanvas"></canvas>

<!-- Stick figure characters -->
<div class="characters-layer" id="characters"></div>

<!-- Message overlay -->
<div class="message-layer">
  <div class="message-inner" id="messageInner">
    <div class="msg-title">Page Not Found</div>
    <div class="msg-code">404</div>
    <div class="msg-desc">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </div>
    <div class="msg-buttons">
      <a href="javascript:history.back()" class="btn btn-outline">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
        Go Back
      </a>
      <a href="/" class="btn btn-filled">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Go Home
      </a>
    </div>
  </div>
</div>

<script>
(function() {
  // ===== 1. Circle Animation =====
  const canvas = document.getElementById('circleCanvas');
  const ctx = canvas.getContext('2d');
  let timer = 0;
  let circulos = [];
  let rafId;

  function initCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initCircles() {
    circulos = [];
    for (let i = 0; i < 300; i++) {
      circulos.push({
        x: Math.floor(Math.random() * (canvas.width * 3 - canvas.width * 1.2 + 1)) + canvas.width * 1.2,
        y: Math.floor(Math.random() * (canvas.height - canvas.height * -0.2 + 1)) + canvas.height * -0.2,
        size: canvas.width / 1000
      });
    }
  }

  function drawCircles() {
    timer++;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const distanceX = canvas.width / 80;
    const growthRate = canvas.width / 1000;
    ctx.fillStyle = 'white';
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    circulos.forEach(c => {
      ctx.beginPath();
      if (timer < 65) {
        c.x -= distanceX;
        c.size += growthRate;
      }
      if (timer > 65 && timer < 500) {
        c.x -= distanceX * 0.02;
        c.size += growthRate * 0.2;
      }
      ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
      ctx.fill();
    });

    if (timer > 500) {
      cancelAnimationFrame(rafId);
      return;
    }
    rafId = requestAnimationFrame(drawCircles);
  }

  function startCircleAnimation() {
    timer = 0;
    if (rafId) cancelAnimationFrame(rafId);
    initCanvas();
    initCircles();
    drawCircles();
  }

  startCircleAnimation();

  // ===== 2. Stick Figure Characters =====
  const stickFigures = [
    { top: '0%', src: 'https://raw.githubusercontent.com/RicardoYare/imagenes/9ef29f5bbe075b1d1230a996d87bca313b9b6a63/sticks/stick0.svg', transform: 'rotateZ(-90deg)', speedX: 1500 },
    { top: '10%', src: 'https://raw.githubusercontent.com/RicardoYare/imagenes/9ef29f5bbe075b1d1230a996d87bca313b9b6a63/sticks/stick1.svg', speedX: 3000, speedRotation: 2000 },
    { top: '20%', src: 'https://raw.githubusercontent.com/RicardoYare/imagenes/9ef29f5bbe075b1d1230a996d87bca313b9b6a63/sticks/stick2.svg', speedX: 5000, speedRotation: 1000 },
    { top: '25%', src: 'https://raw.githubusercontent.com/RicardoYare/imagenes/9ef29f5bbe075b1d1230a996d87bca313b9b6a63/sticks/stick0.svg', speedX: 2500, speedRotation: 1500 },
    { top: '35%', src: 'https://raw.githubusercontent.com/RicardoYare/imagenes/9ef29f5bbe075b1d1230a996d87bca313b9b6a63/sticks/stick0.svg', speedX: 2000, speedRotation: 300 },
    { bottom: '5%', src: 'https://raw.githubusercontent.com/RicardoYare/imagenes/9ef29f5bbe075b1d1230a996d87bca313b9b6a63/sticks/stick3.svg', speedX: 0 }
  ];

  const charsEl = document.getElementById('characters');

  function createStickFigures() {
    charsEl.innerHTML = '';
    stickFigures.forEach((fig, i) => {
      const img = document.createElement('img');
      if (fig.top) img.style.top = fig.top;
      if (fig.bottom) img.style.bottom = fig.bottom;
      img.src = fig.src;
      if (fig.transform) img.style.transform = fig.transform;
      charsEl.appendChild(img);

      if (i === 5) return; // static figure

      img.animate(
        [{ left: '100%' }, { left: '-20%' }],
        { duration: fig.speedX, easing: 'linear', fill: 'forwards' }
      );

      if (i === 0) return; // no rotation for first

      if (fig.speedRotation) {
        img.animate(
          [{ transform: 'rotate(0deg)' }, { transform: 'rotate(-360deg)' }],
          { duration: fig.speedRotation, iterations: Infinity, easing: 'linear' }
        );
      }
    });
  }

  createStickFigures();

  // ===== 3. Message Fade-In =====
  setTimeout(() => {
    document.getElementById('messageInner').classList.add('visible');
  }, 1200);

  // ===== 4. Resize Handler =====
  window.addEventListener('resize', () => {
    startCircleAnimation();
    createStickFigures();
  });
})();
</script>
</body>
</html>
